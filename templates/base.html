<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}R.A.M. Engineering{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', path='images/rrlogo.png') }}" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}?v=13">
    {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

<nav class="navbar">
    <a href="/" class="nav-brand">
        <img class="nav-logo" src="{{ url_for('static', path='images/rrlogo.png') }}" alt="" width="38" height="38">
        <span class="nav-mark">R.A.M. Engineering</span>
        <span class="nav-rest"></span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links">
        <a href="/#team">Our Team</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
    </div>

    <a href="https://forms.gle/5CQCCxuQLDwcRYWi7" class="nav-apply">Apply now</a>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', path='js/main.js') }}?v=2"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
